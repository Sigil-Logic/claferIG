# CI for the Sigil-Logic claferIG fork (Sigil-Logic/clafer#7).
# x86_64 Linux runners: full build + test (including the MiniSat-dependent
# strMapCheck, which cannot run on Apple Silicon), plus capture of the
# Alloy 4.2 behavioral baseline that feeds Sigil-Logic/clafer#5.
# Actions are pinned to full commit SHAs (Dependabot keeps them current);
# only global stack/pantry data is cached, keyed on the dependency plan of
# both packages (this repository and the sibling clafer).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-baseline:
    name: Build, test, and Alloy 4.2 baseline (x86_64 Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claferIG
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: claferIG

      # A claferIG feature branch may depend on in-flight sibling changes
      # (stack builds '../clafer' from source).  Companion branches follow
      # the documented convention (Sigil-Logic/clafer#2): claferIG branch
      # 'feature/clafer-N-desc' pairs with clafer branch 'feature/N-desc'.
      # Build against that clafer branch when it exists, falling back to the
      # identically-named branch, then to master.
      - name: Resolve sibling clafer ref (companion branch or master)
        id: sibling
        run: |
          REF=master
          HEAD_REF="${GITHUB_HEAD_REF:-}"
          if [ -n "$HEAD_REF" ]; then
            CANDIDATE="${HEAD_REF/#feature\/clafer-/feature/}"
            for TRY in "$CANDIDATE" "$HEAD_REF"; do
              if git ls-remote --exit-code --heads https://github.com/Sigil-Logic/clafer.git "$TRY" >/dev/null 2>&1; then
                REF="$TRY"
                break
              fi
            done
          fi
          echo "Sibling clafer ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out sibling clafer (stack package '../clafer')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sigil-Logic/clafer
          ref: ${{ steps.sibling.outputs.ref }}
          path: clafer

      - name: Set up Java (x86_64 Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up stack
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          enable-stack: true
          stack-version: '3.11.1'
          stack-no-global: true

      - name: Cache stack (global pantry and snapshots)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.stack
          key: ${{ runner.os }}-${{ runner.arch }}-stack-claferig-${{ hashFiles('claferIG/stack.yaml', 'claferIG/claferIG.cabal', 'clafer/stack.yaml', 'clafer/clafer.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stack-claferig-

      - name: Extract the MiniSat prover native (amd64-linux)
        run: make lib

      - name: Build (stack build + jar/native staging)
        run: make build

      - name: Test (full suite, strMapCheck included)
        run: make test

      - name: Capture the Alloy 4.2 behavioral baseline
        run: bash scripts/capture-alloy42-baseline.sh 2 baseline-out

      - name: Upload baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alloy42-baseline
          path: claferIG/baseline-out
          if-no-files-found: error
